

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QB Long Ball Challenge</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#101b2b;color:white;

 font-family:Arial,sans-serif;text-align:center

}

header{background:#1d3045;padding:12px}

h1{font-size:23px;margin:5px}

#scoreboard{

 display:flex;justify-content:space-around;

 flex-wrap:wrap;gap:8px;padding:12px;

 background:#28455b;font-weight:bold

}

#message{padding:12px;min-height:48px;color:#ffe28a}

canvas{

 display:block;width:min(100%,500px);

 height:auto;margin:auto;background:#28723a;

 touch-action:none

}

.controls{

 max-width:500px;margin:10px auto;

 display:flex;justify-content:center;

 gap:8px;flex-wrap:wrap;padding:8px

}

button,select{

 border:0;border-radius:9px;padding:12px;

 font-size:14px;font-weight:bold;

 background:#f3bf40;color:#142437

}

button:disabled{opacity:.4}

#stick{

 width:115px;height:115px;margin:10px auto;

 background:#364c62;border:3px solid #8ba4bb;

 border-radius:50%;position:relative;

 touch-action:none

}

#knob{

 width:38px;height:38px;border-radius:50%;

 background:#f3bf40;position:absolute;

 left:35px;top:35px;pointer-events:none

}

small{color:#cbd7e1}

</style>

</head>

<body>

<header>

<h1>🏈 QB LONG BALL CHALLENGE</h1>

<small>Drive downfield and score a touchdown!</small>

</header>

<div id="scoreboard">

<span id="level">Level 1</span>

<span id="down">1st & 10</span>

<span id="yard">Own 20</span>

<span id="td">TDs: 0</span>

</div>

<div id="message">Choose routes and snap the ball!</div>

<canvas id="field" width="400" height="610"></canvas>

<div class="controls">

<select id="leftRoute">

<option value="go">Left: Go</option>

<option value="post">Left: Post</option>

<option value="slant">Left: Slant</option>

</select>

<select id="rightRoute">

<option value="go">Right: Go</option>

<option value="post">Right: Post</option>

<option value="slant">Right: Slant</option>

</select>

<button id="snap">SNAP BALL</button>

<button id="throwL">THROW LEFT</button>

<button id="throwR">THROW RIGHT</button>

<button id="blocker" hidden>Add Offensive Lineman</button>

<button id="restart">RESTART</button>

</div>

<div id="stick"><div id="knob"></div></div>

<small>Move the quarterback using the joystick.</small>

<script>

"use strict";

const canvas=document.getElementById("field");

const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

const W=400,H=610;

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

let level=1,touchdowns=0;

let ball=20,down=1,toGo=10,bonus=false;

let extraBlock=false,phase="ready";

let line=20,playTime=0,transition=0;

let qb,receivers=[],corners=[],rushers=[];

let blockers=[],safety,pass=null,carrier=null;

let joyX=0,joyY=0,lastTime=0;

function message(t){$("message").textContent=t}

function yardText(y){

 return y<=50?"Own "+Math.round(y):

 "Opp "+Math.round(100-y);

}

function updateUI(){

 $("level").textContent="Level "+level;

 $("down").textContent=bonus?"FINAL TD SHOT":

 ["1st","2nd","3rd","4th"][down-1]+" & "+toGo;

 $("yard").textContent=yardText(ball);

 $("td").textContent="TDs: "+touchdowns;

 $("blocker").hidden=level<3||extraBlock;

 $("snap").disabled=phase!=="ready";

 $("throwL").disabled=phase!=="live";

 $("throwR").disabled=phase!=="live";

}

function player(x,y,type){

 return {x,y,type,active:true};

}

function setup(){

 phase="ready";

 line=ball;

 playTime=0;

 pass=null;

 carrier=null;

 qb=player(200,line-5,"QB");

 receivers=[

 {...player(85,line+1,"WR"),

 route:$("leftRoute").value,side:1},

 {...player(315,line+1,"WR"),

 route:$("rightRoute").value,side:-1}

 ];

 corners=[

 player(85,line+7,"CB"),

 player(315,line+7,"CB")

 ];

 safety=player(200,line+27,"S");

 rushers=[player(170,line+3,"DL")];

 if(level>=3){

 rushers.push(player(230,line+3,"DL"));

 }

 blockers=[player(185,line-1,"OL")];

 if(extraBlock){

 blockers.push(player(215,line-1,"OL"));

 }

 updateUI();

}

function routePoint(r,t){

 let forward=Math.min(t*9,45);

 let x=r.side===1?85:315;

 if(r.route==="post"&&forward>12){

 x+=r.side*Math.min((forward-12)*3,100);

 }

 if(r.route==="slant"){

 x+=r.side*Math.min(forward*2.5,90);

 }

 return {

 x:clamp(x,20,380),

 y:line+1+forward

 };

}

function startPlay(){

 if(phase!=="ready")return;

 phase="live";

 playTime=0;

 message(bonus?

 "FINAL PLAY! You must score!":

 "Receivers running! Find an open target!");

 updateUI();

}

function finishPlay(text,gain=0){

 if(phase==="result"||phase==="over")return;

 phase="result";

 transition=1.2;

 ball=clamp(ball+Math.max(0,gain),0,100);

 if(ball>=100){

 touchdowns++;

 level++;

 ball=20;

 down=1;

 toGo=10;

 bonus=false;

 extraBlock=false;

 message("TOUCHDOWN! Level "+level+" unlocked!");

 }

 else if(bonus){

 phase="over";

 message(text+" GAME OVER! Restart to try again.");

 }

 else if(gain>=toGo){

 down=1;

 toGo=Math.min(10,100-ball);

 message(text+" FIRST DOWN!");

 }

 else{

 toGo=Math.max(1,toGo-gain);

 down++;

 if(down>4){

 bonus=true;

 down=4;

 message(text+" FINAL TOUCHDOWN CHANCE!");

 }else{

 message(text+" Next down!");

 }

 }

 updateUI();

}

function throwBall(index){

 if(phase!=="live"||pass)return;

 const r=receivers[index];

 pass={

 x:qb.x,y:qb.y,

 target:r,

 time:0,

 duration:0.6

 };

 message("Pass in the air!");

}

function moveToward(p,target,speed,dt){

 const dx=target.x-p.x;

 const dy=target.y-p.y;

 const d=Math.hypot(dx,dy)||1;

 const step=Math.min(d,speed*dt);

 p.x+=dx/d*step;

 p.y+=dy/d*step;

}

function update(dt){

 if(phase==="result"){

 transition-=dt;

 if(transition<=0){

 setup();

 message(bonus?

 "FINAL TOUCHDOWN ATTEMPT! Snap the ball.":

 "Next play ready. Snap the ball!");

 }

 return;

 }

 if(phase!=="live")return;

 playTime+=dt;

 qb.x=clamp(qb.x+joyX*85*dt,25,375);

 qb.y=clamp(qb.y+joyY*7*dt,line-13,line);

 receivers.forEach((r,i)=>{

 if(carrier===r)return;

 const p=routePoint(r,playTime);

 moveToward(r,p,55,dt);

 moveToward(corners[i],{

 x:r.x+(i===0?10:-10),

 y:r.y-2

 },(38+level*3),dt);

 });

 rushers.forEach((r,i)=>{

 let blocked=false;

 blockers.forEach(b=>{

 if(distance(r,b)<8){

 blocked=true;

 }

 });

 if(!blocked){

 moveToward(r,qb,12+level*2.5,dt);

 }

 if(distance(r,qb)<5&&!carrier){

 finishPlay("Quarterback sacked!",0);

 }

 });

 blockers.forEach((b,i)=>{

 const target=rushers[i%rushers.length];

 moveToward(b,target,16,dt);

 });

 if(carrier){

 carrier.y+=12*dt;

 const defender=corners[receivers.indexOf(carrier)];

 moveToward(defender,carrier,10+level*2,dt);

 moveToward(safety,carrier,12+level*2,dt);

 if(carrier.y>=100){

 finishPlay("Touchdown!",100-line);

 }

 else if(distance(defender,carrier)<6||

 distance(safety,carrier)<6){

 finishPlay("Completed pass!",Math.floor(carrier.y-line));

 }

 return;

 }

 if(pass){

 pass.time+=dt;

 const progress=clamp(pass.time/pass.duration,0,1);

 pass.x=qb.x+(pass.target.x-qb.x)*progress;

 pass.y=qb.y+(pass.target.y-qb.y)*progress;

 if(progress>=1){

 const defender=corners[receivers.indexOf(pass.target)];

 if(distance(defender,pass.target)<4&&

 Math.random()<Math.min(.55,.12+level*.035)){

 pass=null;

 finishPlay("Pass defended!",0);

 }else{

 carrier=pass.target;

 pass=null;

 message("CAUGHT! Run after catch!");

 }

 }

 }

 if(playTime>8&&!carrier){

 finishPlay("Play clock expired!",0);

 }

}

function drawPlayer(p,color,label){

 const y=screenY(p.y);

 if(y< -20||y>H+20)return;

 ctx.beginPath();

 ctx.fillStyle=color;

 ctx.arc(p.x,y,8,0,Math.PI*2);

 ctx.fill();

 ctx.fillStyle="white";

 ctx.font="bold 9px Arial";

 ctx.textAlign="center";

 ctx.fillText(label,p.x,y+3);

}

function screenY(y){

 return H-105-(y-ball)*5.3;

}

function drawField(){

 ctx.fillStyle="#28723a";

 ctx.fillRect(0,0,W,H);

 for(let y=0;y<=100;y+=5){

 const sy=screenY(y);

 if(sy<0||sy>H)continue;

 ctx.strokeStyle="rgba(255,255,255,.5)";

 ctx.beginPath();

 ctx.moveTo(0,sy);

 ctx.lineTo(W,sy);

 ctx.stroke();

 if(y%10===0){

 ctx.fillStyle="white";

 ctx.font="13px Arial";

 ctx.fillText(String(y<=50?y:100-y),22,sy-5);

 ctx.fillText(String(y<=50?y:100-y),375,sy-5);

 }

 }

 const end=screenY(100);

 if(end>=0&&end<=H){

 ctx.fillStyle="#123f8a";

 ctx.fillRect(0,0,W,end);

 ctx.fillStyle="white";

 ctx.font="bold 25px Arial";

 ctx.fillText("TOUCHDOWN",W/2,Math.max(28,end/2));

 }

 const los=screenY(line);

 ctx.strokeStyle="#55c7ff";

 ctx.lineWidth=3;

 ctx.beginPath();

 ctx.moveTo(0,los);

 ctx.lineTo(W,los);

 ctx.stroke();

 const first=screenY(Math.min(100,line+toGo));

 ctx.strokeStyle="#ffdf42";

 ctx.beginPath();

 ctx.moveTo(0,first);

 ctx.lineTo(W,first);

 ctx.stroke();

 ctx.lineWidth=1;

}

function drawRoutes(){

 if(phase!=="ready")return;

 receivers.forEach(r=>{

 ctx.strokeStyle="#ffeb75";

 ctx.lineWidth=3;

 ctx.setLineDash([7,5]);

 ctx.beginPath();

 ctx.moveTo(r.x,screenY(r.y));

 for(let t=0;t<=5;t+=.2){

 const p=routePoint(r,t);

 ctx.lineTo(p.x,screenY(p.y));

 }

 ctx.stroke();

 ctx.setLineDash([]);

 ctx.lineWidth=1;

 });

}

function draw(){

 ctx.clearRect(0,0,W,H);

 drawField();

 drawRoutes();

 blockers.forEach(b=>drawPlayer(b,"#e9c65b","OL"));

 receivers.forEach(r=>drawPlayer(r,"#198cff","WR"));

 corners.forEach(c=>drawPlayer(c,"#e43c4c","CB"));

 rushers.forEach(r=>drawPlayer(r,"#d52e3d","DL"));

 drawPlayer(safety,"#bd2a39","S");

 drawPlayer(qb,"#ffffff","QB");

 if(pass){

 ctx.fillStyle="#79421e";

 ctx.beginPath();

 ctx.ellipse(pass.x,screenY(pass.y),6,4,0,0,Math.PI*2);

 ctx.fill();

 }

}

function loop(time){

 const dt=Math.min((time-lastTime)/1000||0,.04);

 lastTime=time;

 update(dt);

 draw();

 requestAnimationFrame(loop);

}

$("snap").onclick=startPlay;

$("throwL").onclick=()=>throwBall(0);

$("throwR").onclick=()=>throwBall(1);

$("blocker").onclick=()=>{

 extraBlock=true;

 setup();

 message("Second offensive lineman added!");

};

$("restart").onclick=()=>{

 level=1;

 touchdowns=0;

 ball=20;

 down=1;

 toGo=10;

 bonus=false;

 extraBlock=false;

 setup();

 message("New game! Choose routes and snap!");

};

$("leftRoute").onchange=setup;

$("rightRoute").onchange=setup;

const stick=$("stick");

const knob=$("knob");

function moveStick(e){

 const rect=stick.getBoundingClientRect();

 let x=e.clientX-rect.left-rect.width/2;

 let y=e.clientY-rect.top-rect.height/2;

 const max=36;

 const d=Math.hypot(x,y);

 if(d>max){

 x=x/d*max;

 y=y/d*max;

 }

 joyX=x/max;

 joyY=-y/max;

 knob.style.left=(35+x)+"px";

 knob.style.top=(35+y)+"px";

}

stick.addEventListener("pointerdown",e=>{

 stick.setPointerCapture(e.pointerId);

 moveStick(e);

});

stick.addEventListener("pointermove",e=>{

 if(e.buttons)moveStick(e);

});

function resetStick(){

 joyX=0;

 joyY=0;

 knob.style.left="35px";

 knob.style.top="35px";

}

stick.addEventListener("pointerup",resetStick);

stick.addEventListener("pointercancel",resetStick);

setup();

requestAnimationFrame(loop);

</script>

</body>

</html>
